                    requestJson(provenanceEndpoint(clusterId, path)).then(function (payload) {
                        state.provenanceCache.set(nodeKey, payload);
                    }),
                    ensureWalletLoaded(path, force)
                ]).finally(function () {
                    state.loadingNode = false;
                });
            }

            function ancestorPaths(cluster, path) {
                var ancestors = [];
                var normalized = normalizePath(path, cluster.browseRoot);
                var current = cluster.browseRoot;
                ancestors.push(current);
                if (normalized === current) {
                    return ancestors;
                }
                var suffix = normalized.slice(current.length);
                var segments = suffix.split("/").filter(Boolean);
                for (var i = 0; i < segments.length - 1; i++) {
                    current += "/" + segments[i];
                    ancestors.push(current);
                }
                return ancestors;
            }

            function syncHash(path) {
                if (!path) {
                    return;
                }
                window.location.hash = encodeURIComponent(path);
            }

            function loadPath(path, force, allowReject) {
                var cluster = currentCluster();
                if (!cluster) {
                    return Promise.resolve();
                }
                var normalized = normalizePath(path, cluster.browseRoot);
                if (normalized === "/") {
                    normalized = cluster.browseRoot;
                }
                state.currentPath = normalized;
                state.error = "";
                syncHash(normalized);
                ensureExpanded(cluster.clusterId, "/");
                var ancestors = ancestorPaths(cluster, normalized);
                ancestors.forEach(function (ancestor) {
                    ensureExpanded(cluster.clusterId, ancestor);
                });
                render();
                return ancestors.reduce(function (chain, ancestor) {
                    return chain.then(function () {
                        return ensureTreeLoaded(cluster.clusterId, ancestor, force);
                    });
                }, Promise.resolve()).then(function () {
                    return ensureDetailsLoaded(cluster.clusterId, normalized, force);
                }).catch(function (error) {
                    if (allowReject) {
                        throw error;
                    }
                    state.error = error.message || "Failed explorer request";
                }).finally(function () {
                    render();
                });
            }

            function initialPathForCluster(cluster) {
                var hash = window.location.hash ? decodeURIComponent(window.location.hash.slice(1)) : "";
                if (hash) {
                    var normalized = normalizePath(hash, cluster.browseRoot);
                    if (normalized === "/" || normalized.indexOf(cluster.browseRoot) === 0) {
                        return normalized;
                    }
                }
                return DEFAULT_GENESIS_PATH;
            }

            function loadPreferredStartPath(cluster, force) {
                var preferred = initialPathForCluster(cluster);
                if (preferred === cluster.browseRoot) {
                    return loadPath(preferred, force, false);
                }
                return loadPath(preferred, force, true).catch(function () {
                    return loadPath(cluster.browseRoot, force, false);
                });
            }

            function loadExplicitPathFromHash(cluster, force) {
                var hash = window.location.hash ? decodeURIComponent(window.location.hash.slice(1)) : "";
                if (!hash) {
                    return loadPreferredStartPath(cluster, force);
                }
                var normalized = normalizePath(hash, cluster.browseRoot);
                if (normalized === "/" || normalized.indexOf(cluster.browseRoot) === 0) {
                    return loadPath(normalized, force, false);
                }
                return loadPreferredStartPath(cluster, force);
            }

            function isCurrentPathExplicit() {
                return !!(window.location.hash && window.location.hash.length > 1);
            }

            function prefersGenesisLanding(cluster) {
                return cluster && !isCurrentPathExplicit();
            }

            function loadClusterDefault(cluster, force) {
                if (!cluster) {
                    render();
                    return;
                }
                if (prefersGenesisLanding(cluster)) {
                    loadPreferredStartPath(cluster, force);
                    return;
                }
                var normalized = normalizePath(state.currentPath, cluster.browseRoot);
                if (normalized === "/" || normalized.indexOf(cluster.browseRoot) === 0) {
                    loadPath(normalized, force, false);
                    return;
                }
                loadPath(cluster.browseRoot, force, false);
            }

            function loadNavigation(force) {
                return requestJson(NAV_ENDPOINT).then(function (payload) {
                    state.nav = payload;
                    var clusters = [];
                    if (payload.localCluster) {
                        clusters.push(payload.localCluster);
                    }
                    if (payload.mountedNeighbors && payload.mountedNeighbors.length) {
                        clusters = clusters.concat(payload.mountedNeighbors);
                    }
                    state.clusters = clusters;
                    if (!state.selectedClusterId || !clusters.some(function (cluster) { return cluster.clusterId === state.selectedClusterId; })) {
                        state.selectedClusterId = clusters.length ? clusters[0].clusterId : null;
                    }
                    if (force && state.selectedClusterId) {
                        clearClusterCaches(state.selectedClusterId);
                    }
                    return requestJson(SUMMARY_ENDPOINT).catch(function () {
                        return null;
                    });
                }).then(function (summaryPayload) {
                    state.summary = summaryPayload;
                    var cluster = currentCluster();
                    if (!cluster) {
                        render();
                        return;
                    }
                    return loadExplicitPathFromHash(cluster, force);
                }).catch(function (error) {
                    state.error = error.message || "Failed to load explorer navigation";
                    render();
                });
            }

            function toggleTreeNode(toggle) {
                var cluster = currentCluster();
                var path = toggle.getAttribute("data-path");
                if (!cluster || !path) {
                    return;
                }
                if (state.expanded.has(keyFor(cluster.clusterId, path))) {
                    (toggle.getAttribute("data-chain") || path).split("|").forEach(function (chainPath) {
                        state.expanded.delete(keyFor(cluster.clusterId, chainPath));
                    });
                    render();
                    return;
                }
                state.expanded.add(keyFor(cluster.clusterId, path));
                render();
                var load = isShardPath(path) ? expandShardChain(cluster.clusterId, path) : ensureTreeLoaded(cluster.clusterId, path, false);
                load.catch(function (error) {
                    state.error = error.message || "Failed to expand node";
                }).finally(render);
            }

            function handleTreeClick(event) {
                if (event.target.closest("[data-filter-path]")) {
                    return;
                }
                var toggle = event.target.closest("[data-action='toggle']");
                if (toggle) {
                    event.stopPropagation();
                    toggleTreeNode(toggle);
                    return;
                }
                var more = event.target.closest("[data-action='more']");
                if (more) {
                    var cluster = currentCluster();
                    if (cluster) {
                        more.disabled = true;
                        more.textContent = "Loading...";
                        loadMoreChildren(cluster.clusterId, more.getAttribute("data-path")).catch(function (error) {
                            state.error = error.message || "Failed to load more children";
                        }).finally(render);
                    }
                    return;
                }
                var row = event.target.closest("[data-action='select']");
                if (row) {
                    var path = row.getAttribute("data-path");
                    if (path === "/") {
                        var rootCluster = currentCluster();
                        if (rootCluster) {
                            path = rootCluster.browseRoot;
                        }
                    }
                    loadPath(path, false);
                }
            }

            function handleTreeInput(event) {
                var input = event.target.closest("[data-filter-path]");
                var cluster = currentCluster();
                if (!input || !cluster) {
                    return;
                }
                state.treeFilters.set(keyFor(cluster.clusterId, input.getAttribute("data-filter-path")), input.value);
                renderTree();
            }

            function moveTreeSelection(row) {
                if (!row) {
                    return;
                }
                var path = row.getAttribute("data-path");
                state.currentPath = path;
                state.loadingNode = true;
                render();
                clearTimeout(state.keyNavTimer);
                state.keyNavTimer = setTimeout(function () {
                    loadPath(path, false);
                }, 150);
            }

            function parentRow(rows, row) {
                var top = (row.getAttribute("data-chain") || row.getAttribute("data-path")).split("|")[0];
                var parent = top.slice(0, top.lastIndexOf("/")) || "/";
                for (var i = 0; i < rows.length; i++) {
                    if ((rows[i].getAttribute("data-chain") || "").split("|").indexOf(parent) !== -1) {
                        return rows[i];
                    }
                }
                return null;
            }

            function handleTreeKeydown(event) {
                if (event.target.closest("[data-filter-path]")) {
                    return;
                }
                var keys = ["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight", "Home", "End"];
                if (keys.indexOf(event.key) === -1) {
                    return;
                }
                event.preventDefault();
                var rows = Array.prototype.slice.call(treePanel.querySelectorAll(".tree-row")).filter(function (row) {
                    return row.getAttribute("data-path") !== "/";
                });
                var index = -1;
                rows.forEach(function (row, i) {
                    if (row.classList.contains("selected")) {
                        index = i;
                    }
                });
                var row = rows[index];
                if (event.key === "Home" || !row) {
                    moveTreeSelection(rows[0]);
                } else if (event.key === "End") {
                    moveTreeSelection(rows[rows.length - 1]);
                } else if (event.key === "ArrowDown") {
                    moveTreeSelection(rows[index + 1]);
                } else if (event.key === "ArrowUp") {
                    moveTreeSelection(rows[index - 1]);
                } else {
                    var toggle = row.querySelector("[data-action='toggle']");
                    var expanded = toggle && toggle.getAttribute("aria-expanded") === "true";
                    if (event.key === "ArrowRight") {
                        if (toggle && !expanded) {
                            toggleTreeNode(toggle);
                        } else {
                            moveTreeSelection(rows[index + 1]);
                        }
                    } else if (toggle && expanded) {
                        toggleTreeNode(toggle);
                    } else {
                        moveTreeSelection(parentRow(rows, row));
                    }
                }
            }

            function handleTabClick(event) {
                var button = event.target.closest(".tab-button");
                if (!button) {
                    return;
                }
                state.currentTab = button.getAttribute("data-tab");
                render();
            }

            function resolveInputPath(value) {
                var trimmed = String(value || "").trim();
                var wallet = /^(0x[0-9a-f]{40})(\/.*)?$/i.exec(trimmed);
                return wallet ? walletPathFor(wallet[1]) + (wallet[2] || "") : trimmed;
            }

            function startPathEdit() {
                state.editingPath = true;
                renderPathBar();
                var input = document.getElementById("path-edit");
                if (input) {
                    input.focus();
                    input.select();
                }
            }

            function finishPathEdit(commit) {
                if (!state.editingPath) {
                    return;
                }
                var input = document.getElementById("path-edit");
                var value = input ? input.value : "";
                state.editingPath = false;
                if (commit && value.trim()) {
                    loadPath(resolveInputPath(value), false);
                } else {
                    renderPathBar();
                }
            }

            function handlePathClick(event) {
                if (event.target.closest("[data-action='toggle-shards']")) {
                    state.showShards = !state.showShards;
                    renderPathBar();
                    return;
                }
                var button = event.target.closest("[data-path]");
                if (button && !button.classList.contains("current")) {
                    loadPath(button.getAttribute("data-path"), false);
                    return;
                }
                if (!state.editingPath && (event.target === pathBar || event.target.closest("[data-action='edit-path']") || event.target.classList.contains("current"))) {
                    startPathEdit();
                }
            }

            function copyText(text, button) {
                var done = function () {
                    if (button) {
                        var label = button.textContent;
                        button.textContent = "Copied";
                        setTimeout(function () {
                            button.textContent = label;
                        }, 1200);
                    }
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(done).catch(function () {
                        window.prompt("Copy value", text);
                    });
                    return;
                }
                window.prompt("Copy value", text);
            }

            function openValueDialog(index) {
                var property = state.renderedProperties[index];
                if (!property) {
                    return;
                }
                var text = propertyText(property);
                var parsed = property.multiValued ? null : parseJsonValue(text);
                var date = property.multiValued ? "" : epochMillisLabel(property.type, text);
                state.dialogValue = text;
                document.getElementById("value-dialog-name").textContent = property.name;
                document.getElementById("value-dialog-type").textContent = formatType(property.type, property.multiValued)
                    + (parsed !== null ? " (JSON, formatted)" : "") + (date ? " (" + date + ")" : "");
                document.getElementById("value-dialog-body").textContent = parsed !== null ? JSON.stringify(parsed, null, 2) : text;
                valueDialog.showModal();
            }

            function handleTabContentClick(event) {
                var pathButton = event.target.closest("[data-open-path]");
                if (pathButton) {
                    loadPath(pathButton.getAttribute("data-open-path"), false);
                    return;
                }
                var action = event.target.closest("[data-action]");
                if (!action) {
                    return;
                }
                var kind = action.getAttribute("data-action");
                if (kind === "copy-text") {
                    copyText(action.getAttribute("data-copy"), action);
                } else if (kind === "copy-value") {
                    var property = state.renderedProperties[Number(action.getAttribute("data-prop"))];
                    if (property) {
                        copyText(propertyText(property), action);
                    }
                } else if (kind === "view-value") {
                    openValueDialog(Number(action.getAttribute("data-prop")));
                } else if (kind === "check-proposal") {
                    checkProposalStatus(action.getAttribute("data-proposal"));
                }
            }

            function handleTabContentDoubleClick(event) {
                var row = event.target.closest("[data-prop-row]");
                if (row && !event.target.closest("button")) {
                    openValueDialog(Number(row.getAttribute("data-prop-row")));
                }
            }

            function copyCurrentPath() {
                if (state.currentPath) {
                    copyText(state.currentPath, null);
                }
            }

            function bindEvents() {
                document.getElementById("refresh-button").addEventListener("click", function () {
                    loadNavigation(true);
                });
                document.getElementById("browse-root-button").addEventListener("click", function () {
                    var cluster = currentCluster();
                    if (cluster) {
                        loadPath(cluster.browseRoot, false);
                    }
                });
                document.getElementById("copy-path-button").addEventListener("click", copyCurrentPath);
                document.getElementById("open-path-button").addEventListener("click", startPathEdit);
                clusterSelect.addEventListener("change", function () {
                    state.selectedClusterId = clusterSelect.value;
                    state.currentTab = "properties";
                    var cluster = currentCluster();
                    if (cluster) {
                        loadClusterDefault(cluster, false);
                    } else {
                        render();
                    }
                });
                treePanel.addEventListener("click", handleTreeClick);
                treePanel.addEventListener("keydown", handleTreeKeydown);
                treePanel.addEventListener("input", handleTreeInput);
                document.querySelector(".flex.items-end.px-2.pt-2.bg-slate-100").addEventListener("click", handleTabClick);
                pathBar.addEventListener("click", handlePathClick);
                pathBar.addEventListener("keydown", function (event) {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        finishPathEdit(true);
                    } else if (event.key === "Escape") {
                        finishPathEdit(false);
                    }
                });
                pathBar.addEventListener("focusout", function () {
                    finishPathEdit(false);
                });
                tabContent.addEventListener("click", handleTabContentClick);
                tabContent.addEventListener("dblclick", handleTabContentDoubleClick);
                valueDialog.addEventListener("click", function (event) {
                    var action = event.target.closest("[data-dialog]");
                    if (event.target === valueDialog || (action && action.getAttribute("data-dialog") === "close")) {
                        valueDialog.close();
                    } else if (action) {
                        copyText(state.dialogValue, action);
                    }
                });
                document.addEventListener("keydown", function (event) {
                    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
                    if (event.key === "/" && !typing && !valueDialog.open && !event.metaKey && !event.ctrlKey && !event.altKey) {
                        event.preventDefault();
                        startPathEdit();
                    }
                });
            }

            bindEvents();
            loadNavigation(false);
        })();
    </script>
</body>
</html>
